name: RCRI tests and Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and tests
        run: python -m pip install -e ".[test]"
      - name: Check installation
        run: python -m pip check
      - name: Run Python tests
        run: python -m pytest -q
      - name: Verify syntax
        run: python -m compileall -q rcri_lee.py cli.py agents tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test browser calculator
        run: node --test web/app.test.mjs
      - name: Verify browser JavaScript syntax
        run: node --check web/app.js

  deploy:
    name: Publish static RCRI calculator
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
